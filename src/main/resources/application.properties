spring.application.name=inventory-springboot
server.port=${PORT:3000}

spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/inventory.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.auth.jwt-secret-base64=${JWT_SECRET_BASE64:}
app.auth.issuer=${JWT_ISSUER:inventory-api}
app.auth.audience=${JWT_AUDIENCE:inventory-clients}
app.auth.access-token-seconds=${ACCESS_TOKEN_SECONDS:600}
app.auth.refresh-token-seconds=${REFRESH_TOKEN_SECONDS:2592000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.auth.legacy-login-enabled=${LEGACY_LOGIN_ENABLED:false}
app.auth.require-https=${REQUIRE_HTTPS:false}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.reset-admin=${BOOTSTRAP_ADMIN_RESET:false}

spring.jackson.default-property-inclusion=non_null
spring.web.resources.cache.period=0
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
